{% extends 'base.html' %}{% block title %}Edit Item{% endblock %}{% block content %}<section class="form-section"><div class="container"><div class="page-title"><div class="eyebrow">ADMIN • ITEM EDITOR</div><h1>Edit {{ item.name }}</h1></div><div class="form-card"><form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><div class="form-grid"><label>Type<select name="item_type"><option {% if item.item_type=='Lost' %}selected{% endif %}>Lost</option><option {% if item.item_type=='Found' %}selected{% endif %}>Found</option></select></label><label>Item name<input name="name" value="{{ item.name }}" required></label><label>Category<input name="category" value="{{ item.category }}"></label><label>Location<input name="location" value="{{ item.location }}"></label><label>Date<input type="date" name="item_date" value="{{ item.item_date }}"></label><label>Status<select name="status">{% for s in ['Active','Claimed','Returned'] %}<option {% if item.status==s %}selected{% endif %}>{{ s }}</option>{% endfor %}</select></label><label class="full">Description<textarea name="description">{{ item.description }}</textarea></label></div><div class="form-actions"><a class="btn btn-light" href="{{ url_for('admin_items') }}">Cancel</a><button class="btn">Save Item</button></div></form></div></div></section>{% endblock %}
