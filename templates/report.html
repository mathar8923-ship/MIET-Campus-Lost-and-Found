{% extends 'base.html' %}{% block title %}Report Item{% endblock %}{% block content %}<section class="form-section"><div class="container"><div class="page-title"><div class="eyebrow">NEW REPORT</div><h1>Tell the campus what happened</h1><p class="muted">Add enough detail for someone to identify the item.</p></div><div class="form-card"><form method="post" enctype="multipart/form-data"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><div class="form-grid"><label>Report type<select name="item_type"><option>Lost</option><option>Found</option></select></label><label>Item name<input name="name" required placeholder="e.g. Black wallet"></label><label>Category<input name="category" placeholder="Electronics, ID Card, Books..."></label><label>Location<input name="location" placeholder="Where was it lost/found?"></label><label>Date<input type="date" name="item_date"></label><label>Photo<input type="file" name="image" accept="image/*"><small>JPG, PNG, GIF or WEBP</small></label><label class="full">Description<textarea name="description" placeholder="Color, brand, identifying marks, circumstances..."></textarea></label></div><div class="form-actions"><a class="btn btn-light" href="{{ url_for('dashboard') }}">Cancel</a><button class="btn">Publish Report</button></div></form></div></div></section>{% endblock %}
