{% extends 'base.html' %}{% block title %}Admin Settings{% endblock %}{% block content %}<section class="form-section"><div class="container"><div class="page-title"><div class="eyebrow">ADMIN • SECURITY</div><h1>Administrator Settings</h1><p class="muted">Customize the administrator account used to access the control center.</p></div><div class="form-card"><form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><div class="form-grid"><label>Admin name<input name="name" value="{{ admin.name }}" required></label><label>Admin login email<input name="email" type="email" value="{{ admin.email }}" required></label><label>Contact phone<input name="phone" value="{{ admin.phone }}"></label><label>New password<input name="password" type="password" placeholder="Leave blank to keep current"></label></div><div class="form-actions"><a class="btn btn-light" href="{{ url_for('admin_dashboard') }}">Cancel</a><button class="btn">Save Credentials</button></div></form></div></div></section>{% endblock %}
