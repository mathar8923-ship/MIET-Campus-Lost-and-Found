{% extends 'base.html' %}{% block title %}Edit Claim{% endblock %}{% block content %}<section class="form-section"><div class="container"><div class="page-title"><div class="eyebrow">ADMIN • CLAIM EDITOR</div><h1>Edit claim for {{ claim.item_name }}</h1></div><div class="form-card"><form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><div class="form-grid"><h3 class="full">Claimant details</h3><label>Name<input name="claimant_name" value="{{ claim.claimant_name }}" required></label><label>Email<input name="claimant_email" value="{{ claim.claimant_email }}"></label><label>Phone<input name="claimant_phone" value="{{ claim.claimant_phone }}"></label><div></div><h3 class="full">Other person details</h3><label>Name<input name="other_person_name" value="{{ claim.other_person_name }}"></label><label>Email<input name="other_person_email" value="{{ claim.other_person_email }}"></label><label>Phone<input name="other_person_phone" value="{{ claim.other_person_phone }}"></label><label>Status<select name="status">{% for s in ['Pending','Approved','Rejected','Completed'] %}<option {% if claim.status==s %}selected{% endif %}>{{ s }}</option>{% endfor %}</select></label><label class="full">Message<textarea name="message">{{ claim.message }}</textarea></label></div><div class="form-actions"><a class="btn btn-light" href="{{ url_for('admin_claims') }}">Cancel</a><button class="btn">Save Claim</button></div></form></div></div></section>{% endblock %}
