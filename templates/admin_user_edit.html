{% extends 'base.html' %}{% block title %}Edit User{% endblock %}{% block content %}<section class="form-section"><div class="container"><div class="page-title"><div class="eyebrow">ADMIN • USER EDITOR</div><h1>Edit {{ user.name }}</h1></div><div class="form-card"><form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><div class="form-grid"><label>Name<input name="name" value="{{ user.name }}" required></label><label>Email<input name="email" type="email" value="{{ user.email }}" required></label><label>Phone<input name="phone" value="{{ user.phone }}"></label><label>Role<select name="role"><option value="student" {% if user.role=='student' %}selected{% endif %}>Student</option><option value="admin" {% if user.role=='admin' %}selected{% endif %}>Admin</option></select></label><label class="full">New password<small>Leave blank to keep current password.</small><input name="password" type="password"></label></div><div class="form-actions"><a class="btn btn-light" href="{{ url_for('admin_users') }}">Cancel</a><button class="btn">Save User</button></div></form></div></div></section>{% endblock %}
