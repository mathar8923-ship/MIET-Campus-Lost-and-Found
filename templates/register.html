{% extends 'base.html' %}{% block title %}Register{% endblock %}{% block content %}<section class="auth-wrap"><div class="auth-card"><div class="auth-icon">🎓</div><h1>Create account</h1><p class="muted">Join your campus lost & found community.</p><form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>Full name<input name="name" required placeholder="Your name"></label><label>Email<input name="email" type="email" required placeholder="you@college.edu"></label><label>Phone<input name="phone" placeholder="Contact number"></label><label>Password<input name="password" type="password" required placeholder="Create a password"></label><button class="btn btn-full">Create Account</button></form><p class="auth-foot">Already registered? <a href="{{ url_for('login') }}">Login</a></p></div></section>{% endblock %}
